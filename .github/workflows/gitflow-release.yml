name: GitFlow - Release Branch

on:
  push:
    branches: ["release/**"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Release branch name (e.g., release/v1.0.0)"
        required: false

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  validate-release-branch:
    runs-on: ubuntu-latest
    name: Validate Release Branch
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate release branch name
        id: validate
        run: |
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          echo "Branch name: $BRANCH_NAME"
          
          # Check if branch follows GitFlow naming convention
          if [[ $BRANCH_NAME =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "✅ Release branch follows GitFlow convention"
            echo "valid=true" >> $GITHUB_OUTPUT
            
            # Extract version
            VERSION=$(echo $BRANCH_NAME | sed 's/^release\///')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "❌ Release branch name does not follow convention"
            echo "valid=false" >> $GITHUB_OUTPUT
            echo "Expected format: release/v1.0.0, release/v2.1.0, etc."
            exit 1
          fi

      - name: Get previous version
        id: previous
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          
          echo "## 🚀 Release Branch Information" >> $GITHUB_STEP_SUMMARY
          echo "- New Version: ${{ steps.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Previous Version: $LATEST_TAG" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: $BRANCH_NAME" >> $GITHUB_STEP_SUMMARY

  freeze-and-test:
    runs-on: ubuntu-latest
    name: Release Freeze & Testing
    needs: [validate-release-branch]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        run: |
          echo "Running comprehensive test suite for release..."
          npm run lint
          npx tsc --noEmit
          npm run build
          npm run test:unit --if-present || echo "No tests"

      - name: Build for production
        run: npm run build

      - name: Verify bundle size
        run: |
          echo "## 📦 Bundle Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "dist" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            du -sh dist/ | awk '{print "Total: " $1}' >> $GITHUB_STEP_SUMMARY
            find dist -type f -name "*.js" -o -name "*.css" | head -5 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload release build
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: dist/
          retention-days: 14

  release-notes:
    runs-on: ubuntu-latest
    name: Generate Release Notes
    needs: [validate-release-branch]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          NEW_VERSION="${{ needs.validate-release-branch.outputs.version }}"
          
          echo "## 📝 Changelog for $NEW_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Commits since $LATEST_TAG" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          if [ "$LATEST_TAG" = "v0.0.0" ]; then
            git log --oneline --pretty=format:"%h - %s (%an, %ar)" >> $GITHUB_STEP_SUMMARY
          else
            git log $LATEST_TAG..HEAD --oneline --pretty=format:"%h - %s (%an, %ar)" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Analyze commits
        run: |
          echo "## 🔍 Commit Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          
          if [ "$LATEST_TAG" = "v0.0.0" ]; then
            FEATURES=$(git log --oneline | grep -i "feat:" | wc -l)
            FIXES=$(git log --oneline | grep -i "fix:" | wc -l)
          else
            FEATURES=$(git log $LATEST_TAG..HEAD --oneline | grep -i "feat:" | wc -l)
            FIXES=$(git log $LATEST_TAG..HEAD --oneline | grep -i "fix:" | wc -l)
          fi
          
          echo "- Features: $FEATURES" >> $GITHUB_STEP_SUMMARY
          echo "- Bug Fixes: $FIXES" >> $GITHUB_STEP_SUMMARY

  release-checklist:
    runs-on: ubuntu-latest
    name: Release Checklist
    needs: [freeze-and-test, release-notes]
    if: always()
    
    steps:
      - name: Create pre-merge checklist
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## 🚀 Release Branch Pre-Merge Checklist

### Automated Verification
- ✅ Branch naming valid
- ✅ Build successful
- ✅ All tests passing
- ✅ Security checks passed

### Pre-Release Checklist
Please verify before merging:

- [ ] Version number is correct
- [ ] CHANGELOG.md is updated
- [ ] package.json version is updated
- [ ] All documentation is current
- [ ] No breaking changes introduced (or documented)
- [ ] Performance impact assessed
- [ ] Database migrations tested (if applicable)
- [ ] Environment variables documented
- [ ] API documentation updated (if applicable)
- [ ] Security review completed

### Release Process
1. Merge this PR to \`main\`
2. Create release tag automatically
3. Merge back to \`develop\`
4. Deploy to production

### Quality Metrics
- Build Status: ${{ needs.freeze-and-test.result }}
- Release Notes: Generated ✅

---
See [Release Process Guide](../../docs/GITFLOW.md) for detailed instructions.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  security-audit:
    runs-on: ubuntu-latest
    name: Release Security Audit
    needs: [validate-release-branch]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: |
          echo "## 🔒 Release Security Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          npm audit --audit-level=moderate 2>&1 | tail -20 >> $GITHUB_STEP_SUMMARY || true

      - name: Check for secrets
        run: |
          echo "Scanning for secrets in release..."
          if grep -r "password\|secret\|key\|token" src --include="*.ts" --include="*.tsx" | grep -v node_modules | grep "=\|:"; then
            echo "⚠️ Potential secrets found - review before release"
          fi
        continue-on-error: true

  version-bump:
    runs-on: ubuntu-latest
    name: Version Bump Validation
    needs: [validate-release-branch]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate version bump
        run: |
          NEW_VERSION="${{ needs.validate-release-branch.outputs.version }}"
          
          # Extract numeric version
          MAJOR=$(echo $NEW_VERSION | cut -d'.' -f1 | sed 's/v//')
          MINOR=$(echo $NEW_VERSION | cut -d'.' -f2)
          PATCH=$(echo $NEW_VERSION | cut -d'.' -f3)
          
          echo "## ✅ Version Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Major: $MAJOR" >> $GITHUB_STEP_SUMMARY
          echo "- Minor: $MINOR" >> $GITHUB_STEP_SUMMARY
          echo "- Patch: $PATCH" >> $GITHUB_STEP_SUMMARY
          echo "- Full Version: $NEW_VERSION" >> $GITHUB_STEP_SUMMARY

  release-summary:
    runs-on: ubuntu-latest
    name: Release Summary
    needs: [validate-release-branch, freeze-and-test, release-notes, security-audit, version-bump]
    if: always()
    
    steps:
      - name: Generate release summary
        run: |
          echo "## 📊 Release Branch Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Release: ${{ needs.validate-release-branch.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Status Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch Validation | ${{ needs.validate-release-branch.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Tests | ${{ needs.freeze-and-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release Notes | ${{ needs.release-notes.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Audit | ${{ needs.security-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version Validation | ${{ needs.version-bump.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Ready for Release?" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.validate-release-branch.result }}" == "success" && "${{ needs.freeze-and-test.result }}" == "success" ]]; then
            echo "✅ **YES** - All checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **NO** - Some checks failed" >> $GITHUB_STEP_SUMMARY
          fi
