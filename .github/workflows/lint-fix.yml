name: Auto Lint & Format

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'package.json'
      - '.eslintrc*'
      - '.prettierrc*'
  pull_request:
    branches: [main, develop]
  schedule:
    # Run every day at 2 AM UTC to keep code clean
    - cron: '0 2 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    name: Lint & Format Code

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint --fix
        run: npm run lint -- --fix
        continue-on-error: true

      - name: Run Prettier --write
        run: npx prettier --write .
        continue-on-error: true

      - name: Check if changes exist
        id: verify-changed-files
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "aminone070@gmail.com"
          git config --local user.name "Vingo AI Bot"
          git add -A
          git commit -m "ci: auto lint and format code"

      - name: Push changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: git push origin ${{ github.ref }}

      - name: Verify no errors
        run: npm run lint
