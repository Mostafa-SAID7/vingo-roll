name: Setup Branch Protection

on:
  push:
    branches: [main]
    paths:
      - ".github/branch-protection.yml"
  workflow_dispatch:

permissions:
  contents: read
  administration: write

jobs:
  setup-branch-protection:
    runs-on: ubuntu-latest
    name: Configure Branch Protection Rules

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup branch protection for main
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.repos.updateBranchProtection({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'main',
                required_pull_request_reviews: {
                  required_approving_review_count: 1,
                  dismiss_stale_reviews: true,
                  require_code_owner_reviews: false
                },
                required_status_checks: {
                  strict: true,
                  contexts: ['build', 'lint', 'type-check']
                },
                required_conversation_resolution: true,
                enforce_admins: false,
                allow_force_pushes: false,
                allow_deletions: false
              });
              console.log('✅ Branch protection configured for main');
            } catch (error) {
              console.error('Error configuring branch protection:', error.message);
            }

      - name: Setup branch protection for develop
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.repos.updateBranchProtection({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'develop',
                required_pull_request_reviews: {
                  required_approving_review_count: 1,
                  dismiss_stale_reviews: true,
                  require_code_owner_reviews: false
                },
                required_status_checks: {
                  strict: true,
                  contexts: ['build', 'lint']
                },
                required_conversation_resolution: true,
                enforce_admins: false,
                allow_force_pushes: false,
                allow_deletions: false
              });
              console.log('✅ Branch protection configured for develop');
            } catch (error) {
              console.error('Error configuring branch protection:', error.message);
            }
