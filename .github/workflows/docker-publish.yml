name: Docker Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  REGISTRY_DOCKER_HUB: docker.io
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME: vingo-roll-studio

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        registry: [docker-hub, ghcr]
    name: Build and Push (${{ matrix.registry }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: matrix.registry == 'docker-hub' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GHCR
        if: matrix.registry == 'ghcr' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (Docker Hub)
        if: matrix.registry == 'docker-hub'
        id: meta-docker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_DOCKER_HUB }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata (GHCR)
        if: matrix.registry == 'ghcr'
        id: meta-ghcr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_GHCR }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (Docker Hub)
        if: matrix.registry == 'docker-hub'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-docker.outputs.tags }}
          labels: ${{ steps.meta-docker.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ steps.meta-docker.outputs.created }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta-docker.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (GHCR)
        if: matrix.registry == 'ghcr'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-ghcr.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ steps.meta-ghcr.outputs.created }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta-ghcr.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-image:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'pull_request'
    name: Test Docker Image

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: vingo-roll-studio:test
          cache-from: type=gha

      - name: Test image
        run: |
          docker run -d --name test-container vingo-roll-studio:test
          sleep 5
          docker ps | grep test-container
          docker inspect test-container
          docker logs test-container
          docker stop test-container
          docker rm test-container

      - name: Scan image for vulnerabilities
        if: always()
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            vingo-roll-studio:test || true

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-and-push, test-image]
    if: startsWith(github.ref, 'refs/tags/v')
    name: Publish Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            ## Docker Images

            ### Docker Hub
            \`\`\`bash
            docker pull ${{ secrets.DOCKER_USERNAME }}/vingo-roll-studio:${{ github.ref_name }}
            \`\`\`

            ### GitHub Container Registry
            \`\`\`bash
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            \`\`\`

            ### Run
            \`\`\`bash
            docker run -p 3000:3000 ${{ secrets.DOCKER_USERNAME }}/vingo-roll-studio:${{ github.ref_name }}
            \`\`\`

          draft: false
          prerelease: false
