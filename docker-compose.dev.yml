version: '3.8'

services:
  vingo-roll-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: vingo-roll-studio-dev
    ports:
      - "5173:5173"
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=3000
    restart: unless-stopped
    networks:
      - vingo-network

networks:
  vingo-network:
    driver: bridge
