name: PR Validation

on:
  pull_request:
    branches: [main, develop, "feature/**", "bugfix/**", "release/**", "hotfix/**"]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    name: PR Metadata Validation
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate PR title
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const body = context.payload.pull_request.body;
            
            console.log('PR Title:', title);
            console.log('PR Body length:', body?.length || 0);
            
            // Check PR title format
            const titleRegex = /^(feat|fix|docs|style|refactor|perf|test|chore|ci)(\(.+\))?:/;
            
            if (!titleRegex.test(title)) {
              console.warn('⚠️ PR title does not follow conventional commits format');
              console.warn('Expected: feat(scope): description or fix: description');
            }
            
            // Check PR has description
            if (!body || body.trim().length < 20) {
              core.setFailed('PR description is required and must be at least 20 characters');
            }

      - name: Check PR has linked issues
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const body = context.payload.pull_request.body;
            const hasLinkedIssue = body && (body.includes('#') || body.includes('Fixes') || body.includes('Closes'));
            
            if (!hasLinkedIssue) {
              console.warn('⚠️ PR does not appear to link to any issues');
            }

      - name: Validate base branch
        run: |
          echo "## PR Validation" >> $GITHUB_STEP_SUMMARY
          echo "- Base Branch: ${{ github.base_ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- Head Branch: ${{ github.head_ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- PR Title: ${{ github.event.pull_request.title }}" >> $GITHUB_STEP_SUMMARY

  lint-and-format:
    runs-on: ubuntu-latest
    name: Lint & Format Check
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint PR changes
        id: lint
        run: npm run lint 2>&1 | tee lint-output.txt || true
        continue-on-error: true

      - name: Format check
        id: format
        run: npm run format -- --check 2>&1 | tee format-output.txt || true
        continue-on-error: true

      - name: Comment on lint issues
        if: steps.lint.outcome != 'success' || steps.format.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## 🔍 Code Quality Issues\n\n';
            
            try {
              const lintOutput = fs.readFileSync('lint-output.txt', 'utf8');
              if (lintOutput) {
                comment += '### ESLint Issues\n```\n' + lintOutput.substring(0, 500) + '\n```\n\n';
              }
            } catch (e) {}
            
            try {
              const formatOutput = fs.readFileSync('format-output.txt', 'utf8');
              if (formatOutput) {
                comment += '### Format Issues\n```\n' + formatOutput.substring(0, 500) + '\n```\n\n';
              }
            } catch (e) {}
            
            comment += '**Please fix these issues before merging.**';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: lint-output.txt
          retention-days: 7

  type-check:
    runs-on: ubuntu-latest
    name: TypeScript Check
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        id: tsc
        run: npx tsc --noEmit 2>&1 | tee ts-check.txt || true
        continue-on-error: true

      - name: Report TypeScript errors
        if: steps.tsc.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('ts-check.txt', 'utf8');
            const lines = output.split('\n');
            const errors = lines.filter(line => line.includes('error')).length;
            
            const comment = `## ⚠️ TypeScript Issues\n\nFound **${errors}** type errors.\n\n\`\`\`\n${output.substring(0, 1000)}\n\`\`\`\n\n**Please resolve these before merging.**`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  build-check:
    runs-on: ubuntu-latest
    name: Build Check
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        id: build
        run: npm run build 2>&1 | tee build-output.txt
        continue-on-error: true

      - name: Report build failure
        if: steps.build.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Build Failed**\n\nThe project failed to build. Please fix the errors and push again.\n\nCheck the workflow logs for details.'
            });

      - name: Upload build artifacts
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pr-build
          path: dist/
          retention-days: 7

  test-coverage:
    runs-on: ubuntu-latest
    name: Test Coverage
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        id: tests
        run: npm run test:unit --if-present || echo "No tests configured"
        continue-on-error: true

      - name: Generate coverage
        if: always()
        run: npm run test:coverage --if-present || echo "No coverage script"
        continue-on-error: true

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/coverage-final.json
          fail_ci_if_error: false

  security-scan:
    runs-on: ubuntu-latest
    name: Security Scan
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=moderate 2>&1 | tee audit.txt || true
        continue-on-error: true

      - name: Check for secrets
        run: |
          echo "Scanning for secrets..."
          if grep -r "password\s*=\s*['\"]" src --include="*.ts" --include="*.tsx"; then
            echo "⚠️ Potential secrets found"
          fi
        continue-on-error: true

  file-changes:
    runs-on: ubuntu-latest
    name: File Changes Analysis
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze changes
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            console.log(`PR touches ${files.length} files`);
            
            const changes = {
              components: 0,
              data: 0,
              lib: 0,
              tests: 0,
              docs: 0,
              workflows: 0,
              other: 0
            };
            
            files.forEach(file => {
              if (file.filename.includes('components')) changes.components++;
              else if (file.filename.includes('data')) changes.data++;
              else if (file.filename.includes('lib')) changes.lib++;
              else if (file.filename.includes('test') || file.filename.includes('spec')) changes.tests++;
              else if (file.filename.includes('docs')) changes.docs++;
              else if (file.filename.includes('.github/workflows')) changes.workflows++;
              else changes.other++;
            });
            
            let summary = '## 📊 File Changes\n\n| Category | Count |\n|----------|-------|\n';
            Object.entries(changes).forEach(([key, count]) => {
              if (count > 0) summary += `| ${key} | ${count} |\n`;
            });
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

  size-check:
    runs-on: ubuntu-latest
    name: Bundle Size Check
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and check size
        run: |
          npm run build
          
          echo "## 📦 Bundle Size" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "dist" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            du -sh dist/ >> $GITHUB_STEP_SUMMARY
            find dist -type f -name "*.js" -o -name "*.css" | xargs du -h | sort -rh | head -5 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

  pr-ready-check:
    runs-on: ubuntu-latest
    name: PR Ready Check
    needs: [validate-pr, lint-and-format, type-check, build-check, test-coverage, security-scan, file-changes, size-check]
    if: always()
    
    steps:
      - name: Determine PR status
        run: |
          echo "## ✅ PR Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Metadata | ${{ needs.validate-pr.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Format | ${{ needs.lint-and-format.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript | ${{ needs.type-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test-coverage.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          
      - name: Set PR status
        if: |
          needs.validate-pr.result == 'success' &&
          needs.lint-and-format.result == 'success' &&
          needs.type-check.result == 'success' &&
          needs.build-check.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Ready for Review** - All automated checks passed!'
            });

      - name: Request changes if needed
        if: |
          needs.build-check.result != 'success' ||
          needs.type-check.result != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Please Fix Issues** - Some automated checks failed. See the logs and details above.'
            });
