name: Build & Quality Checks

on:
  push:
    branches: [main, develop, "feature/**", "bugfix/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build & Test
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint
        continue-on-error: true

      - name: Format check
        run: npm run format -- --check
        continue-on-error: true

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build project
        run: npm run build

      - name: Archive build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.node-version }}
          path: dist/
          retention-days: 5

  quality:
    runs-on: ubuntu-latest
    name: Code Quality
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint results
        run: npm run lint 2>&1 | tee lint-results.txt || true

      - name: TypeScript diagnostics
        run: npx tsc --noEmit 2>&1 | tee ts-diagnostics.txt || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            lint-results.txt
            ts-diagnostics.txt
          retention-days: 30

  summary:
    runs-on: ubuntu-latest
    needs: [build, quality]
    if: always()
    name: Build Summary

    steps:
      - name: Check build status
        run: |
          echo "✅ Build completed"
          echo "Node versions tested: 20.x, 22.x"
          echo "Quality checks run: ESLint, Prettier, TypeScript"

      - name: Report results
        if: always()
        run: |
          if [[ "${{ needs.build.result }}" == "success" ]]; then
            echo "✅ All builds successful"
          else
            echo "⚠️ Build issues detected - check logs"
          fi
